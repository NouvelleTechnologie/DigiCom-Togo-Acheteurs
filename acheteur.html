
<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigiCom Togo Acheteur</title><script src="https://cdn.tailwindcss.com"></script>
<script src="script.js" type="text/javascript" charset="utf-8"></script>
</head>
<body class="bg-gray-50 min-h-screen"><script>
const SECURITY_KEY="DigiCom2027@"; if(localStorage.getItem('dc_key')!==SECURITY_KEY) localStorage.setItem('dc_key',SECURITY_KEY);
const DRIVE_URL="https://script.google.com/macros/s/AKfycbyrAA9Zsr9GXLnx8g-x0HxYXPDrCtCa03ZkQyXaS1Nxn4mMTNujPLNNisz_KKK5Oe9MSQ/exec";
const ADMIN_TEL="93721174";
function getProds(){return JSON.parse(localStorage.getItem('produits_digi_v8')||'[]');}
function getCmds(){return JSON.parse(localStorage.getItem('commandes_v8')||'[]');}
function saveCmds(c){localStorage.setItem('commandes_v8',JSON.stringify(c));}
function backupDrive(t,r){try{fetch(DRIVE_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({table:t,row:r,_k:SECURITY_KEY})});}catch(e){}}
let panier=JSON.parse(localStorage.getItem('panier_v8')||'[]'),aLat=null,aLng=null;
function haversine(a,b,c,d){const R=6371;const dLat=(c-a)*Math.PI/180;const dLon=(d-b)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function calcTarif(d){if(d<=2)return 500;if(d<=5)return 1000;if(d<=10)return 1500;if(d<=20)return 2500;return 2500+Math.round((d-20)*100);}
function render(){let s=document.getElementById('search').value.toLowerCase();let f=getProds().filter(p=>p.statut==='approuve'&&(!s||p.nom.toLowerCase().includes(s)));document.getElementById('grid').innerHTML=f.map(p=>`<div class='bg-white p-4 rounded-2xl border shadow'><b>${p.nom}</b><p class=text-xs>${p.vendeur} ${p.tel}</p><p class='text-xs bg-yellow-50 p-2 rounded mt-2'>GPS ${p.gps} • Base ${p.tarifBase}F</p><div class='flex justify-between mt-3'><b class=text-green-700>${p.prix}F</b><button onclick='add(${p.id})' class='bg-green-600 text-white px-4 py-2 rounded-xl'>Ajouter</button></div></div>`).join('')||'Aucun produit';}
function add(id){let pr=getProds().find(p=>p.id===id);let ex=panier.find(p=>p.id===id);if(ex) ex.qte++; else panier.push({id:pr.id,nom:pr.nom,prix:pr.prix,vendeur:pr.vendeur,tel:pr.tel,qte:1,lat:pr.lat,lng:pr.lng,tarifBase:pr.tarifBase});localStorage.setItem('panier_v8',JSON.stringify(panier));upd();}
function upd(){let c=panier.reduce((s,p)=>s+p.qte,0);document.getElementById('count').innerText=c;let tp=panier.reduce((s,p)=>s+p.prix*p.qte,0);document.getElementById('totProd').innerText=tp+'F';document.getElementById('list').innerHTML=panier.map((p,i)=>`<div class='flex justify-between bg-white p-3 rounded-xl mb-2 border'><div><b>${p.nom}</b> ${p.prix}F x ${p.qte}</div><button onclick='panier.splice(${i},1);localStorage.setItem("panier_v8",JSON.stringify(panier));upd();check()' class='bg-red-100 px-2 rounded-full'>X</button></div>`).join('');}
function capAcheteur(){navigator.geolocation.getCurrentPosition(p=>{aLat=p.coords.latitude;aLng=p.coords.longitude;document.getElementById('aGps').value=aLat.toFixed(6)+','+aLng.toFixed(6);check();});}
function check(){if(!aLat)return;let maxT=0,maxD=0;for(let p of panier){if(p.lat&&p.lng){let d=haversine(aLat,aLng,p.lat,p.lng);let t=calcTarif(d);if(t>maxT){maxT=t;maxD=d;}}else{if(p.tarifBase>maxT)maxT=p.tarifBase;}}document.getElementById('frais').innerText=maxT+'F ('+maxD.toFixed(1)+'km)';let tp=panier.reduce((s,p)=>s+p.prix*p.qte,0);document.getElementById('totFinal').innerText=(tp+maxT)+'F';}
function showPanier(){document.getElementById('modalPanier').classList.remove('hidden');upd();check();}
function showPay(){if(panier.length===0){alert('Vide');return;}let nom=document.getElementById('aNom').value.trim(),tel=document.getElementById('aTel').value.trim(),addr=document.getElementById('addr').value.trim(),gps=document.getElementById('aGps').value.trim();if(!nom||!tel||!addr||!gps){alert('Remplis');return;}document.getElementById('modalPanier').classList.add('hidden');document.getElementById('modalPay').classList.remove('hidden');let fr=parseInt(document.getElementById('frais').innerText)||500;let tp=panier.reduce((s,p)=>s+p.prix*p.qte,0);document.getElementById('resume').innerHTML=`Produits ${tp}F + Livraison ${fr}F = <b>${tp+fr}F</b><br>Paiement effectue ${panier[0].tel}`;document.getElementById('numVendeur').value=panier[0].tel;}
function payer(){let trans=document.getElementById('transId').value.trim();if(!trans){alert('ID');return;}let fr=parseInt(document.getElementById('frais').innerText)||500;let tp=panier.reduce((s,p)=>s+p.prix*p.qte,0);let ref='DIGI'+Date.now().toString().slice(-6);let recu={ref,date:new Date().toLocaleString(),acheteur:document.getElementById('aNom').value,tel:document.getElementById('aTel').value,transId:trans,numVendeur:document.getElementById('numVendeur').value,adresse:document.getElementById('addr').value,gps:document.getElementById('aGps').value,produits:panier,total:tp+fr,distance:document.getElementById('frais').innerText,statut:'En attente verif - '+trans,_k:SECURITY_KEY};let cmds=getCmds();cmds.push(recu);saveCmds(cmds);backupDrive('commandes',recu);document.getElementById('modalPay').classList.add('hidden');document.getElementById('modalRecu').classList.remove('hidden');document.getElementById('recu').innerHTML=`✅ Commande ${ref} ${recu.total}F<br>Distance ${recu.distance}<br><a href=tel:${ADMIN_TEL} class='bg-red-600 text-white px-4 py-2 rounded-xl inline-block mt-3'>📞 Reclamation ${ADMIN_TEL}</a><br><a href=tel:${recu.numVendeur} class='bg-green-600 text-white px-4 py-2 rounded-xl inline-block mt-2'>📞 Appeler vendeur ${recu.numVendeur}</a>`;panier=[];localStorage.setItem('panier_v8',JSON.stringify(panier));}
window.onload=function(){render();upd();}
</script>
<header class="bg-green-600 text-white p-4 flex justify-between sticky top-0 z-20"><b>DigiCom Togo</b> <small>Acheteur</small><div class="flex gap-2"><a href="tel:93721174" class="bg-red-500 px-3 py-2 rounded-full text-xs">📞 Reclamation</a><button onclick="showPanier()" class="bg-white text-green-700 px-6 py-2 rounded-full font-bold">Panier <span id="count" class="bg-green-600 text-white px-2 rounded-full text-xs"><h4>0</h4></span></button></div></header>
<div class="max-w-7xl mx-auto p-4"><input id="search" oninput="render()" placeholder="Rechercher..." class="w-full p-3 border-2 rounded-2xl mb-4"><div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div></div>
<div id="modalPanier" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50"><div class="bg-gray-50 rounded-3xl w-full max-w-xl flex flex-col max-h-[90vh]"><div class="p-4 bg-green-600 text-white rounded-t-3xl flex justify-between"><b>Panier</b><button onclick="document.getElementById('modalPanier').classList.add('hidden')">X</button></div><div class="flex-1 overflow-y-auto p-4"><div id="list"></div><div class="bg-white p-4 rounded-2xl border mt-4 space-y-2"><input id="aNom" placeholder="Nom *" class="w-full p-3 border-2 rounded-xl"><input id="aTel" placeholder="Tel *" class="w-full p-3 border-2 rounded-xl" type="number"><input id="addr" placeholder="Adresse *" class="w-full p-3 border-2 rounded-xl"><div class="flex gap-2"><input id="aGps" placeholder="GPS *" class="flex-1 p-3 border-2 rounded-xl bg-yellow-50"><button onclick="capAcheteur()" class="bg-red-500 text-white px-3 rounded-xl">GPS</button></div><div class="bg-blue-50 p-3 rounded-xl text-xs">Frais : <b id="frais">500F</b> | Produits <b id="totProd">0F</b> | Total <b id="totFinal">0F</b></div></div></div><div class="p-4 bg-white rounded-b-3xl"><button onclick="showPay()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold">VALIDER Paiement</button></div></div></div>
<div id="modalPay" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50"><div class="bg-white rounded-3xl w-full max-w-lg p-6"><div id="resume" class="p-3 bg-gray-50 rounded-xl text-sm border"></div><input type="hidden" id="numVendeur"><input id="transId" placeholder="ID transaction" class="w-full mt-4 p-4 border-2 border-yellow-400 rounded-xl text-center font-bold"><div class="flex gap-2 mt-4"><button onclick="document.getElementById('modalPay').classList.add('hidden');document.getElementById('modalPanier').classList.remove('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Retour</button><button onclick="payer()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">J'ai paye</button></div></div></div>
<div id="modalRecu" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50"><div class="bg-white rounded-3xl w-full max-w-lg p-6"><div id="recu"></div><button onclick="document.getElementById('modalRecu').classList.add('hidden')" class="w-full mt-4 bg-green-600 text-white py-3 rounded-xl">OK</button></div></div>
</body></html>
